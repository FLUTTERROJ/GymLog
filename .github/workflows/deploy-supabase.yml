name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "backend/supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so setup does not call the GitHub releases API to
          # resolve "latest" on every run.
          version: 2.34.3

      - name: Validate Supabase credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN is missing" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF is missing" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD is missing" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy calendar authorization
        run: supabase functions deploy calendar-authorize --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy calendar OAuth callback
        run: supabase functions deploy calendar-oauth-callback --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy calendar preview
        run: supabase functions deploy calendar-preview --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy reminder sender
        run: supabase functions deploy calendar-send-reminders --project-ref "$SUPABASE_PROJECT_REF"
